<h1>Fried Rice</h1>

<img src="../images/friedchicken.jpg" width="300" alt="Fried-Chicken">

<h2>Description</h2>
<p>Fried rice is a simple and tasty rice dish.</p>

<h2>Ingredients</h2>
<ul>
    <li>Rice</li>
    <li>Eggs</li>
    <li>Carrots</li>
    <li>Green onions</li>
    <li>Soy sauce</li>
</ul>

<h2>Steps</h2>
<ol>
    <li>Cook the rice.</li>
    <li>Cook the vegetables.</li>
    <li>Add the eggs.</li>
    <li>Add the rice and soy sauce.</li>
    <li>Stir and cook until done.</li>
</ol>
